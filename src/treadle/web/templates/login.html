{% extends "base.html" %}
{% block content %}
<h1>Sign in</h1>
{% if error %}
<div class="error-summary" role="alert">
  <p><span aria-hidden="true">✗</span> {{ error }}</p>
</div>
{% endif %}
<form class="login-form" method="post" action="/login">
  {{ csrf() }}
  <input type="hidden" name="next" value="{{ next }}">
  <div class="field">
    <label for="token">Access token</label>
    <p class="hint" id="token-hint">The token this Treadle server was started with.</p>
    <input type="password" id="token" name="token" autocomplete="current-password" required aria-describedby="token-hint">
  </div>
  <button type="submit">Sign in</button>
</form>
{% endblock %}

name: Deploy blog on push
description: Rebuild and publish the blog when main changes on the Forgejo server.
triggers:
  webhook:
    name: blog-push
    secret_env: BLOG_HOOK_SECRET
    signature_header: X-Forgejo-Signature
concurrency: replace
timeout: 45m
steps:
  - id: note
    uses: log
    with:
      message: "Push to ${{ trigger.body.ref }} (${{ trigger.body.after }})"
  - id: build
    if: trigger.body.ref == 'refs/heads/main'
    env:
      COMMIT: ${{ trigger.body.after }}
    with:
      cwd: ~/sites/blog
    run: |
      case "$COMMIT" in (*[!0-9a-f]*|'') echo "unexpected commit id" >&2; exit 2;; esac
      git fetch --quiet origin
      git checkout --quiet --detach "$COMMIT"
      hugo --minify
    timeout: 10m
  - id: publish
    if: steps.build.status == 'succeeded'
    uses: shell
    with:
      cwd: ~/sites/blog
      argv: [rsync, -a, --delete, public/, /var/www/blog/]
  - id: ping
    if: steps.publish.status == 'succeeded'
    uses: http
    continue_on_error: true
    retry: {attempts: 5, delay: 2s, backoff: 2, jitter: 0.2}
    with:
      url: https://blog.example.net/healthz
      expect: [200]
    outputs:
      healthy: ${{ result.status == 200 }}
